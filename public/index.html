<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOBOR PRODUCTION</title>
<style>
  body{background:#0B0B0F;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
  .wrap{max-width:800px;margin:0 auto}
  .card{background:#15151B;border:1px solid #26262E;border-radius:12px;padding:20px;margin-bottom:15px}
  .btn{background:#FF3D00;color:#fff;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:5px}
  .btn-admin{background:#C6FF00;color:#000}
  .btn-del{background:#ff5555}
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .header-right { display: flex; gap: 8px; }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: #8A8A93; margin-bottom: 5px; }
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box;font-family:inherit;}
  input:focus { outline: none; border-color: #C6FF00; }
  
  .season-title{border-bottom:1px solid #333;padding-bottom:5px;margin-top:20px;margin-bottom:10px;color:#C6FF00;font-size:20px}
  .video-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #222}
  .video-item a{color:#C6FF00;text-decoration:none;font-weight:bold}
  video{width:100%;border-radius:10px;margin-top:10px;background:#000}
  .player-box{margin-top:20px;display:none}
  .save-badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;background:rgba(0,200,120,.15);color:#00C878}
</style>
</head>
<body>
<div class="wrap">
  
  <div class="header">
    <h1>🎬 BOBOR PRODUCTION</h1>
    <div class="header-right" id="header-right">
      <!-- Сюда будут добавляться кнопки, если ты вошел -->
    </div>
  </div>
  
  <!-- Админ панель -->
  <div class="card" id="admin-panel" style="display:none; border-color:#C6FF00">
    <h3 style="color:#C6FF00;margin-top:0">Панель админа</h3>
    
    <div class="form-group">
      <label>Название серии</label>
      <input type="text" id="v-title" placeholder="Например: Пилот">
    </div>
    
    <div style="display:flex; gap:10px;">
      <div class="form-group" style="flex:1">
        <label>Номер сезона</label>
        <input type="number" id="v-season" value="1" min="1">
      </div>
      <div class="form-group" style="flex:1">
        <label>Номер серии</label>
        <input type="number" id="v-episode" value="1" min="1">
      </div>
    </div>

    <div class="form-group">
      <label>Прямая ссылка на видео (mp4)</label>
      <input type="text" id="v-url" placeholder="https://...">
    </div>
    
    <button class="btn btn-admin" onclick="addVideo()">Загрузить</button>
  </div>

  <!-- Плеер -->
  <div class="card player-box" id="player-box">
    <h3 id="player-title" style="margin-top:0"></h3>
    <video id="video-player" controls></video>
    <div style="margin-top:10px">
      <a id="download-link" href="#" download><button class="btn">⬇ Скачать видео</button></a>
    </div>
  </div>

  <!-- Список видео -->
  <div id="video-list"></div>
</div>

<script>
let isAdmin = false;
let adminPass = localStorage.getItem('bobor_cinema_pass') || '';

// Проверяем, заходил ли админ ранее
function checkAuth() {
  if (adminPass) {
    fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ password: adminPass })
    }).then(r => {
      if (r.ok) {
        isAdmin = true;
        showAdminUI();
      } else {
        localStorage.removeItem('bobor_cinema_pass');
        adminPass = '';
      }
      loadVideos();
    });
  } else {
    loadVideos();
  }
}

// Показать кнопки управления в шапке
function showAdminUI() {
  document.getElementById('admin-panel').style.display = 'block';
  const headerRight = document.getElementById('header-right');
  headerRight.innerHTML = `
    <span class="save-badge">● Режим админа</span>
    <button class="btn" onclick="window.location.reload()">🔄 Обновить</button>
    <button class="btn" onclick="logout()">Выйти</button>
  `;
}

// Вход
function login() {
  const p = prompt('Введите пароль админа:');
  if (!p) return;
  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ password: p })
  }).then(r => {
    if (r.ok) {
      isAdmin = true;
      adminPass = p;
      localStorage.setItem('bobor_cinema_pass', p); // СОХРАНЯЕМ ПАРОЛЬ
      showAdminUI();
      loadVideos();
    } else {
      alert('Неверный пароль!');
    }
  });
}

// Выход
function logout() {
  isAdmin = false;
  adminPass = '';
  localStorage.removeItem('bobor_cinema_pass'); // УДАЛЯЕМ ПАРОЛЬ
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('header-right').innerHTML = `<button class="btn" onclick="login()">Вход для админа</button>`;
  loadVideos();
}

// Добавить видео
function addVideo() {
  const title = document.getElementById('v-title').value;
  const season = document.getElementById('v-season').value;
  const episode = document.getElementById('v-episode').value;
  const url = document.getElementById('v-url').value;

  if (!title || !url) {
    alert('Заполни название и ссылку!');
    return;
  }

  fetch('/api/videos', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ password: adminPass, title, season, episode, url })
  }).then(() => {
    document.getElementById('v-title').value = '';
    document.getElementById('v-url').value = '';
    loadVideos();
  });
}

// Удалить видео
function deleteVideo(id) {
  if(!confirm('Удалить?')) return;
  fetch('/api/videos/' + id, {
    method: 'DELETE',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ password: adminPass })
  }).then(() => loadVideos());
}

// Показать видео в плеере
function playVideo(v) {
  document.getElementById('player-box').style.display = 'block';
  document.getElementById('player-title').innerText = `Сезон ${v.season}, Серия ${v.episode}: ${v.title}`;
  document.getElementById('video-player').src = v.url;
  document.getElementById('download-link').href = v.url;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Загрузка списка
function loadVideos() {
  fetch('/api/videos').then(r => r.json()).then(data => {
    const listDiv = document.getElementById('video-list');
    listDiv.innerHTML = '';

    if (data.length === 0) {
      listDiv.innerHTML = '<div class="card">Пока нет видео.</div>';
      return;
    }

    const seasons = {};
    data.forEach(v => {
      if (!seasons[v.season]) seasons[v.season] = [];
      seasons[v.season].push(v);
    });

    for (const s in seasons) {
      const seasonDiv = document.createElement('div');
      seasonDiv.innerHTML = `<div class="season-title">Сезон ${s}</div>`;
      
      seasons[s].sort((a,b) => a.episode - b.episode).forEach(v => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<span>Серия ${v.episode}: ${v.title}</span>`;
        
        const btnGrp = document.createElement('div');
        btnGrp.innerHTML = `<button class="btn" onclick='playVideo(${JSON.stringify(v)})'>▶ Смотреть</button>`;
        
        if (isAdmin) {
          btnGrp.innerHTML += ` <button class="btn btn-del" onclick="deleteVideo(${v.id})">Удалить</button>`;
        }
        
        item.appendChild(btnGrp);
        seasonDiv.appendChild(item);
      });
      listDiv.appendChild(seasonDiv);
    }
  });
}

// Старт
checkAuth();
// Если не админ, показываем кнопку входа
if(!adminPass) {
  document.getElementById('header-right').innerHTML = `<button class="btn" onclick="login()">Вход для админа</button>`;
}
</script>
</body>
</html>
