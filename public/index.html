<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOBOR PRODUCTION</title>
<style>
  body{background:#0B0B0F;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
  .wrap{max-width:800px;margin:0 auto}
  .card{background:#15151B;border:1px solid #26262E;border-radius:12px;padding:20px;margin-bottom:15px}
  .btn{background:#FF3D00;color:#fff;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:5px;font-family:inherit}
  .btn2{background:#C6FF00;color:#000;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:5px;font-family:inherit}
  .btn-admin{background:#C6FF00;color:#000}
  .btn-del{background:#ff5555}
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: #8A8A93; margin-bottom: 5px; }
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box;font-family:inherit;}
  input:focus { outline: none; border-color: #C6FF00; }
  
  .season-title{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333;padding-bottom:5px;margin-top:20px;margin-bottom:10px;color:#C6FF00;font-size:20px}
  .season-badge { font-size: 12px; background: #C6FF00; color: #000; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
  
  .video-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #222; flex-wrap:wrap; gap:10px;}
  .video-item a{color:#C6FF00;text-decoration:none;font-weight:bold}
  video, iframe{width:100%;border-radius:10px;margin-top:10px;background:#000;border:0; aspect-ratio: 16 / 9;}
  .player-box{margin-top:20px;display:none}
  .save-badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;background:rgba(0,200,120,.15);color:#00C878}
  .login-box { max-width: 400px; margin: 50px auto; }
  
  .progress-bar { height: 4px; background: #333; border-radius: 2px; margin-top: 5px; width: 100%; max-width: 200px;}
  .progress-fill { height: 100%; background: #FF3D00; border-radius: 2px; width: 0%; transition: width 0.3s; }
  .resume-btn { background: #C6FF00; color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 10px; }
  
  .watched-icon { color: #C6FF00; margin-left: 5px; font-weight: bold; }
  .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .btn-close { background: #ff5555; padding: 5px 10px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  
  <div class="card login-box" id="login-screen">
    <h2 style="text-align:center">🎬 BOBOR PRODUCTION</h2>
    <p style="text-align:center;color:#8A8A93">Вход через аккаунт банка</p>
    <div class="form-group"><label>Email</label><input type="email" id="log-email" placeholder="your@email.com"></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="log-pass" placeholder="Пароль"></div>
    <div class="form-group"><label>Секретное слово</label><input type="password" id="log-secret" placeholder="Секретное слово"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Войти</button>
  </div>

  <div id="main-ui" style="display:none">
    <div class="header">
      <h1>🎬 BOBOR PRODUCTION</h1>
      <div class="header-right" id="header-right"></div>
    </div>

    <div class="card" id="admin-panel" style="display:none; border-color:#C6FF00">
      <h3 style="color:#C6FF00;margin-top:0">Панель админа</h3>
      <div class="form-group"><label>Название</label><input type="text" id="v-title" placeholder="Например: Пилот"></div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1"><label>Сезон</label><input type="number" id="v-season" value="1" min="1"></div>
        <div class="form-group" style="flex:1"><label>Серия</label><input type="number" id="v-episode" value="1" min="1"></div>
      </div>
      <div class="form-group"><label>Ссылка на видео (mp4)</label><input type="text" id="v-url" placeholder="https://files.catbox.moe/...mp4"></div>
      <button class="btn btn-admin" onclick="addVideo()">Загрузить</button>

      <h3 style="color:#C6FF00;margin-top:20px;border-top:1px solid #333;padding-top:15px;">📢 Оповестить всех</h3>
      <div class="form-group"><label>Заголовок пуша</label><input type="text" id="push-title" value="Новая серия!"></div>
      <div class="form-group"><label>Текст пуша</label><input type="text" id="push-body" placeholder="Вышла новая серия Говорящего Тома!"></div>
      <button class="btn btn-admin" onclick="sendPushAll()">Отправить Push</button>
    </div>

    <div class="card player-box" id="player-box">
      <div class="player-header">
        <h3 id="player-title" style="margin:0"></h3>
        <button class="btn btn-close" onclick="closePlayer()">✖ Закрыть видео</button>
      </div>
      <div id="resume-container"></div>
      <div id="player-container"></div>
      <div style="margin-top:10px"><a id="download-link" href="#" download><button class="btn">⬇ Скачать видео</button></a></div>
    </div>

    <div id="video-list"></div>
  </div>
</div>

<script>
let currentUser = null;
let adminPass = '';
let userProgress = {}; 
let currentVideoData = null;
let saveInterval = null;

const VAPID_PUBLIC_KEY = 'BDSQV3ErFOaHSypEHDpmWYwrtOl5ABCHm_kuHrVpAiFSY_QMNijaMF3-JUWb0RovQmUioZ_dzujoNezlVO9wo98';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function togglePushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Ваш браузер не поддерживает push-уведомления');
    return;
  }

  const b = document.getElementById('enable-push-btn');
  
  try {
    const registration = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();

    if (subscription) {
      await subscription.unsubscribe();
      alert('Уведомления отключены');
      b.textContent = '🔔 Включить уведомления';
      b.style.background = '#C6FF00';
      b.style.color = '#000';
    } else {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('Вы отклонили разрешение на уведомления');
        return;
      }

      const newSub = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });

      const userEmail = currentUser ? currentUser.email : null;

      const response = await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: userEmail,
          subscription: newSub.toJSON()
        })
      });

      if (response.ok) {
        alert('Уведомления успешно включены!');
        b.textContent = '✅ Уведомления включены (Выключить)';
        b.style.background = 'rgba(255, 61, 0, 0.2)';
        b.style.color = '#FF3D00';
      } else {
        alert('Ошибка сохранения подписки на сервере');
      }
    }
  } catch (error) {
    console.error('Ошибка при переключении пушей:', error);
    alert('Ошибка: ' + error.message);
  }
}

function sendPushAll() {
  const title = document.getElementById('push-title').value;
  const body = document.getElementById('push-body').value;
  if (!title || !body) return alert('Заполни заголовок и текст');
  
  fetch('/api/push/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: adminPass, title, body })
  }).then(r => {
    if (r.ok) alert('Рассылка отправлена!');
    else alert('Ошибка доступа');
  });
}

function doLogin() {
  const email = document.getElementById('log-email').value;
  const password = document.getElementById('log-pass').value;
  const secret = document.getElementById('log-secret').value;
  if (!password || !secret) return alert('Заполните пароль и секретное слово');

  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email, password, secret })
  }).then(async r => {
    if (r.ok) {
      const data = await r.json();
      currentUser = data.user;
      if (currentUser.role === 'admin') adminPass = password;
      
      localStorage.setItem('bobor_cinema_user', JSON.stringify(currentUser));
      if (adminPass) localStorage.setItem('bobor_cinema_pass', adminPass);
      
      showMainUI(); 
    } else {
      const err = await r.json();
      alert(err.error || 'Ошибка входа');
    }
  });
}

function checkSavedLogin() {
  const saved = localStorage.getItem('bobor_cinema_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    adminPass = localStorage.getItem('bobor_cinema_pass') || '';
    showMainUI();
  } else {
    document.getElementById('login-screen').style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem('bobor_cinema_user');
  localStorage.removeItem('bobor_cinema_pass');
  location.reload(); 
}

function showMainUI() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-ui').style.display = 'block';
  
  const right = document.getElementById('header-right');
  right.innerHTML = `
    <span class="save-badge">● ${currentUser.name}</span> 
    <button class="btn2" id="enable-push-btn" onclick="togglePushNotifications()">🔔 Уведомления</button>
    <button class="btn" onclick="location.reload()">🔄 Обновить</button>
    <button class="btn" onclick="logout()">Выйти</button>
  `;
  
  if (currentUser.role === 'admin') {
    document.getElementById('admin-panel').style.display = 'block';
  }
  
  setTimeout(() => {
    const b = document.getElementById('enable-push-btn');
    if (b && Notification.permission === 'granted') {
      navigator.serviceWorker.getRegistration().then(reg => {
        reg?.pushManager.getSubscription().then(sub => {
          if (sub) {
            b.textContent = '✅ Вкл (Выкл)';
            b.style.background = 'rgba(255, 61, 0, 0.2)';
            b.style.color = '#FF3D00';
          }
        });
      });
    }
  }, 100);
  
  loadProgress();
  loadVideos();
}

function loadProgress() {
  if (!currentUser || currentUser.email === 'guest') return;
  fetch('/api/progress/' + currentUser.email)
    .then(r => r.json())
    .then(data => {
      userProgress = {};
      data.forEach(p => { userProgress[p.video_id] = { progress: p.progress, duration: p.duration }; });
    });
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function addVideo() {
  const title = document.getElementById('v-title').value;
  const url = document.getElementById('v-url').value;
  if(!title || !url) return alert('Заполни данные');
  fetch('/api/videos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: adminPass, title, season: document.getElementById('v-season').value, episode: document.getElementById('v-episode').value, url }) })
  .then(() => { document.getElementById('v-title').value = ''; document.getElementById('v-url').value = ''; loadVideos(); alert('Готово!'); });
}

function loadVideos() {
  fetch('/api/videos').then(r => r.json()).then(data => {
    const list = document.getElementById('video-list'); list.innerHTML = '';
    if(!data.length) return list.innerHTML = '<div class="card">Нет видео.</div>';
    
    const seasons = {};
    data.forEach(v => { if(!seasons[v.season]) seasons[v.season]=[]; seasons[v.season].push(v); });
    
    for(const s in seasons) {
      const sDiv = document.createElement('div');
      let allWatched = true;
      seasons[s].forEach(v => {
        const p = userProgress[v.id];
        const isWatched = p && p.duration > 0 && (p.progress / p.duration) > 0.9; 
        if (!isWatched) allWatched = false;
      });
      sDiv.innerHTML = `<div class="season-title"><span>Сезон ${s}</span>${allWatched ? '<span class="season-badge">✔ Просмотрено</span>' : ''}</div>`;
      
      seasons[s].sort((a,b) => a.episode - b.episode).forEach(v => {
        const item = document.createElement('div'); item.className = 'video-item';
        const p = userProgress[v.id];
        let percent = 0;
        let isWatched = false;
        if (p && p.duration > 0) {
           percent = Math.min((p.progress / p.duration) * 100, 100);
           if (percent > 90) isWatched = true; 
        }
        const leftDiv = document.createElement('div');
        leftDiv.style.flex = '1';
        leftDiv.innerHTML = `<span>Серия ${v.episode}: ${v.title}</span>${isWatched ? '<span class="watched-icon">✔</span>' : ''}`;
        if (percent > 0 && !isWatched) {
           const pb = document.createElement('div'); pb.className = 'progress-bar';
           pb.innerHTML = `<div class="progress-fill" style="width:${percent}%"></div>`;
           leftDiv.appendChild(pb);
        }
        item.appendChild(leftDiv);
        
        const b = document.createElement('div');
        b.innerHTML = `<button class="btn" onclick='playV(${JSON.stringify(v)})'>▶ Смотреть</button>`;
        if(currentUser.role === 'admin') b.innerHTML += ` <button class="btn btn-del" onclick="delV(${v.id})">Удалить</button>`;
        item.appendChild(b); 
        sDiv.appendChild(item);
      });
      list.appendChild(sDiv);
    }
  });
}

function delV(id) { if(!confirm('Удалить?')) return; fetch('/api/videos/'+id, { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: adminPass }) }).then(() => loadVideos()); }

function renderResumeButton(v) {
  const container = document.getElementById('resume-container');
  container.innerHTML = '';
  const p = userProgress[v.id];
  if (p && p.progress > 10) {
    const btn = document.createElement('button');
    btn.className = 'resume-btn';
    btn.innerText = `▶ Продолжить с ${formatTime(p.progress)}`;
    btn.onclick = () => {
      const videoEl = document.querySelector('#player-container video');
      if (videoEl) { videoEl.currentTime = p.progress; videoEl.play(); container.innerHTML = ''; }
    };
    container.appendChild(btn);
  }
}

function saveProgress(video, vId) {
  if (!currentUser || currentUser.email === 'guest' || !video.duration || video.currentTime === 0) return;
  fetch('/api/progress', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: currentUser.email, video_id: vId, progress: video.currentTime, duration: video.duration }) });
  userProgress[vId] = { progress: video.currentTime, duration: video.duration };
}

function playV(v) {
  currentVideoData = v;
  document.getElementById('player-box').style.display = 'block';
  document.getElementById('player-title').innerText = `Сезон ${v.season}, Серия ${v.episode}: ${v.title}`;
  const c = document.getElementById('player-container'); c.innerHTML = '';
  const video = document.createElement('video'); 
  video.src = v.url; video.controls = true; video.preload = 'metadata';
  video.onloadedmetadata = () => {
    if (userProgress[v.id] && !userProgress[v.id].duration) userProgress[v.id].duration = video.duration;
    renderResumeButton(v);
  };
  if (saveInterval) clearInterval(saveInterval);
  saveInterval = setInterval(() => { saveProgress(video, v.id); }, 5000);
  video.onpause = () => saveProgress(video, v.id);
  video.onended = () => { saveProgress(video, v.id); loadVideos(); };
  c.appendChild(video);
  document.getElementById('download-link').href = v.url;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closePlayer() {
  if (saveInterval) clearInterval(saveInterval);
  const videoEl = document.querySelector('#player-container video');
  if (videoEl && currentVideoData) { saveProgress(videoEl, currentVideoData.id); videoEl.pause(); }
  document.getElementById('player-box').style.display = 'none';
  loadVideos(); 
}

checkSavedLogin();
</script>
</body>
</html>
