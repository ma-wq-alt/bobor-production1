<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOBOR PRODUCTION</title>
<style>
  /* ... Все твои стили кино ... */
  body{background:#0B0B0F;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
  .wrap{max-width:800px;margin:0 auto}
  .card{background:#15151B;border:1px solid #26262E;border-radius:12px;padding:20px;margin-bottom:15px}
  .btn{background:#FF3D00;color:#fff;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:5px;font-family:inherit}
  .btn2{background:#C6FF00;color:#000;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:5px;font-family:inherit}
  /* ... и т.д. ... */
</style>
</head>
<body>
<div class="wrap">
  
  <div class="card login-box" id="login-screen">
    <h2 style="text-align:center">🎬 BOBOR PRODUCTION</h2>
    <p style="text-align:center;color:#8A8A93">Вход через аккаунт банка</p>
    <div class="form-group"><label>Email</label><input type="email" id="log-email" placeholder="your@email.com"></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="log-pass" placeholder="Пароль"></div>
    <div class="form-group"><label>Секретное слово</label><input type="password" id="log-secret" placeholder="Секретное слово"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Войти</button>
  </div>

  <div class="card check-screen" id="check-screen" style="display:none; text-align:center; padding:50px 20px;">
    <h2 style="color:#FFB800; font-size:24px;" id="check-title">⏳ Проверка...</h2>
    <p style="color:#8A8A93; font-size:15px; margin-top:10px;" id="check-text">Проверяем ваш BOBOR-ID...</p>
    <button class="btn2" style="width:100%; margin-top:20px; display:none;" id="btn-goto-id" onclick="window.open('https://bobor-passport.onrender.com', '_blank')">Перейти в BOBOR-ID</button>
    <button class="btn" style="width:100%; margin-top:10px; display:none;" id="btn-retry" onclick="location.reload()">Я подтвердил, проверить</button>
  </div>

  <div id="main-ui" style="display:none">
    <!-- ... Твой старый интерфейс кино (заголовок, админка, плеер, список видео) ... -->
  </div>
</div>

<script>
let currentUser = null;
let adminPass = '';
let userProgress = {}; 
let currentVideoData = null;
let saveInterval = null;

// === НОВАЯ ПРОВЕРКА ID ===
function checkID() {
  if (localStorage.getItem('cinema_approved') === 'true') {
    let saved = localStorage.getItem('bobor_cinema_user');
    if(saved) currentUser = JSON.parse(saved);
    showMainUI(); 
    return;
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('check-screen').style.display = 'block';
  document.getElementById('check-title').innerText = '⏳ Проверка...';
  document.getElementById('check-title').style.color = '#FFB800';
  document.getElementById('check-text').innerText = 'Проверяем ваш BOBOR-ID...';
  document.getElementById('btn-goto-id').style.display = 'none';
  document.getElementById('btn-retry').style.display = 'none';

  let emailToCheck = localStorage.getItem('bobor_cinema_user') 
    ? JSON.parse(localStorage.getItem('bobor_cinema_user')).email 
    : localStorage.getItem('bobor_email') || localStorage.getItem('id_email');

  // ЕСЛИ НЕТ EMAIL - ОКНО BOBOR-ID
  if (!emailToCheck) {
    document.getElementById('check-title').innerText = '🪪 ВХОД ЧЕРЕЗ BOBOR-ID';
    document.getElementById('check-title').style.color = '#C6FF00';
    document.getElementById('check-text').innerText = 'Чтобы смотреть кино, получите BOBOR-ID.';
    document.getElementById('btn-goto-id').style.display = 'block';
    document.getElementById('btn-retry').style.display = 'block'; // Кнопка "У меня уже есть" (перезагрузит и пустит)
    return;
  }

  // ЕСЛИ EMAIL ЕСТЬ - ПРОВЕРЯЕМ
  fetch('https://bobor-passport.onrender.com/api/approval/' + emailToCheck)
    .then(r => r.json())
    .then(data => {
      if (data.approved) {
        localStorage.setItem('cinema_approved', 'true');
        let saved = localStorage.getItem('bobor_cinema_user');
        if(saved) currentUser = JSON.parse(saved);
        else currentUser = { email: emailToCheck, name: 'Зритель', role: 'user' };
        showMainUI();
      } else {
        document.getElementById('check-title').innerText = '⏳ ОЖИДАНИЕ';
        document.getElementById('check-title').style.color = '#FFB800';
        document.getElementById('check-text').innerText = 'Ваш BOBOR-ID не подтвержден. Подождите админа.';
        document.getElementById('btn-goto-id').style.display = 'block';
        document.getElementById('btn-retry').style.display = 'block';
      }
    })
    .catch(() => {
      showMainUI(); 
    });
}

// В остальном код кино не меняется
</script>
</body>
</html>
