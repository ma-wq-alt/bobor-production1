<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOBOR PRODUCTION</title>
<style>
  body{background:#0B0B0F;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
  .wrap{max-width:900px;margin:0 auto}
  .card{background:#15151B;border:1px solid #26262E;border-radius:12px;padding:20px;margin-bottom:15px}
  .btn{background:#FF3D00;color:#fff;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:5px;font-family:inherit}
  .btn-admin{background:#C6FF00;color:#000}
  .btn-del{background:#ff5555}
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .nav-tabs button { background: #15151B; color: #8A8A93; border: 1px solid #26262E; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
  .nav-tabs button.active { background: rgba(255,61,0,.15); color: #FF3D00; border-color: #FF3D00; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: #8A8A93; margin-bottom: 5px; }
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box;font-family:inherit;}
  input:focus { outline: none; border-color: #C6FF00; }
  .season-title{border-bottom:1px solid #333;padding-bottom:5px;margin-top:20px;margin-bottom:10px;color:#C6FF00;font-size:20px}
  .video-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #222; flex-wrap:wrap; gap:10px;}
  video, iframe{width:100%;border-radius:10px;margin-top:10px;background:#000;border:0; aspect-ratio: 16 / 9;}
  .player-box{margin-top:20px;display:none}
  .save-badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;background:rgba(0,200,120,.15);color:#00C878}
  
  /* ЧАТ */
  .chat-container { display: flex; gap: 10px; height: 500px; }
  .chat-sidebar { width: 200px; background: #000; border: 1px solid #26262E; border-radius: 10px; overflow-y: auto; padding: 10px; }
  .chat-sidebar .user-item { display: flex; align-items: center; gap: 10px; padding: 8px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: #8A8A93; }
  .chat-sidebar .user-item:hover { background: #1a1a1a; }
  .chat-sidebar .user-item.active { background: #26262E; color: #fff; font-weight: bold; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #FF3D00; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 14px; flex-shrink: 0;}
  .chat-main { flex: 1; display: flex; flex-direction: column; background: #000; border: 1px solid #26262E; border-radius: 10px; padding: 10px; }
  .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .msg { display: flex; gap: 8px; max-width: 80%; }
  .msg.my { align-self: flex-end; flex-direction: row-reverse; }
  .msg-bubble { background: #26262E; padding: 8px 12px; border-radius: 10px; }
  .msg.my .msg-bubble { background: #FF3D00; }
  .msg-name { font-size: 10px; color: #8A8A93; margin-bottom: 2px; }
  .login-box { max-width: 400px; margin: 50px auto; }
</style>
</head>
<body>
<div class="wrap">
  
  <!-- ЛОГИН -->
  <div class="card login-box" id="login-screen">
    <h2 style="text-align:center">🎬 BOBOR PRODUCTION</h2>
    <p style="text-align:center;color:#8A8A93">Вход через банк</p>
    <div class="form-group"><label>Email</label><input type="email" id="log-email" placeholder="your@email.com"></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="log-pass" placeholder="Пароль (или тсб)"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Войти</button>
    <button class="btn" style="width:100%;background:transparent;color:#8A8A93;margin-top:10px" onclick="viewAsGuest()">Зайти как гость</button>
  </div>

  <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
  <div id="main-ui" style="display:none">
    <div class="header">
      <h1>🎬 BOBOR PRODUCTION</h1>
      <div class="header-right" id="header-right"></div>
    </div>

    <div class="nav-tabs">
      <button id="tab-cinema" class="active" onclick="switchTab('cinema')">Кино</button>
      <button id="tab-chat" onclick="switchTab('chat')">Мессенджер</button>
    </div>

    <!-- АДМИНКА -->
    <div class="card" id="admin-panel" style="display:none; border-color:#C6FF00">
      <h3 style="color:#C6FF00;margin-top:0">Панель админа (Видео)</h3>
      <div class="form-group"><label>Название</label><input type="text" id="v-title" placeholder="Пилот"></div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1"><label>Сезон</label><input type="number" id="v-season" value="1"></div>
        <div class="form-group" style="flex:1"><label>Серия</label><input type="number" id="v-episode" value="1"></div>
      </div>
      <div class="form-group"><label>Ссылка (mp4)</label><input type="text" id="v-url" placeholder="https://..."></div>
      <button class="btn btn-admin" onclick="addVideo()">Загрузить</button>
    </div>

    <!-- КИНО -->
    <div id="screen-cinema">
      <div class="card player-box" id="player-box">
        <h3 id="player-title" style="margin-top:0"></h3>
        <div id="player-container"></div>
        <div style="margin-top:10px"><a id="download-link" href="#" download><button class="btn">⬇ Скачать</button></a></div>
      </div>
      <div id="video-list"></div>
    </div>

    <!-- ЧАТ -->
    <div id="screen-chat" style="display:none">
      <div class="card">
        <div class="chat-container">
          <div class="chat-sidebar" id="chat-sidebar">
            <div class="user-item active" onclick="selectChat('general', 'Общий чат', this)">
              <div class="avatar" style="background:#00C878">#</div> Общий чат
            </div>
            <div class="user-item" onclick="selectChat('news_channel', 'Новости', this)">
              <div class="avatar" style="background:#C6FF00;color:#000">📢</div> Новости
            </div>
            <div style="margin: 10px 0; border-top: 1px solid #26262E;"></div>
            <div id="users-list-container"></div>
          </div>
          <div class="chat-main">
            <div style="margin-bottom:10px; font-weight:bold; color:#8A8A93" id="chat-header">Общий чат</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div style="display:flex; gap:5px;">
              <input type="text" id="chat-input" placeholder="Написать..." onkeydown="if(event.key==='Enter') sendMsg()">
              <button class="btn" onclick="sendMsg()">➤</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let adminPass = '';
let currentChatId = 'general';
let currentChatName = 'Общий чат';
let allUsers = [];

function doLogin() {
  const email = document.getElementById('log-email').value;
  const password = document.getElementById('log-pass').value;
  if (!password) return alert('Введите пароль');

  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email, password })
  }).then(async r => {
    if (r.ok) {
      const data = await r.json();
      currentUser = data.user;
      if (currentUser.role === 'admin') adminPass = password;
      localStorage.setItem('bobor_cinema_user', JSON.stringify(currentUser));
      if (adminPass) localStorage.setItem('bobor_cinema_pass', adminPass);
      showMainUI();
    } else {
      const err = await r.json();
      alert(err.error || 'Ошибка входа');
    }
  });
}

function viewAsGuest() {
  currentUser = { name: 'Гость', email: 'guest_' + Date.now(), role: 'guest' };
  showMainUI();
}

function checkSavedLogin() {
  const saved = localStorage.getItem('bobor_cinema_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    adminPass = localStorage.getItem('bobor_cinema_pass') || '';
    showMainUI();
  } else {
    document.getElementById('login-screen').style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem('bobor_cinema_user');
  localStorage.removeItem('bobor_cinema_pass');
  location.reload();
}

function showMainUI() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-ui').style.display = 'block';
  
  const right = document.getElementById('header-right');
  right.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px">
      <div class="avatar">${currentUser.name[0].toUpperCase()}</div>
      <b>${currentUser.name}</b>
      <button class="btn" onclick="logout()">Выйти</button>
    </div>`;
  
  if (currentUser.role === 'admin') {
    document.getElementById('admin-panel').style.display = 'block';
  }
  
  loadVideos();
  loadUsersList();
  setInterval(() => { 
    loadChat(); 
    if (currentChatId === 'general') loadUsersList(); 
  }, 2000);
}

function switchTab(tab) {
  document.getElementById('tab-cinema').className = tab === 'cinema' ? 'active' : '';
  document.getElementById('tab-chat').className = tab === 'chat' ? 'active' : '';
  document.getElementById('screen-cinema').style.display = tab === 'cinema' ? 'block' : 'none';
  document.getElementById('screen-chat').style.display = tab === 'chat' ? 'block' : 'none';
  if (tab === 'chat') { loadChat(); loadUsersList(); }
}

// --- ВИДЕО ---
function addVideo() {
  const title = document.getElementById('v-title').value;
  const url = document.getElementById('v-url').value;
  if(!title || !url) return alert('Заполни данные');
  fetch('/api/videos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: adminPass, title, season: document.getElementById('v-season').value, episode: document.getElementById('v-episode').value, url }) })
  .then(() => { document.getElementById('v-title').value = ''; document.getElementById('v-url').value = ''; loadVideos(); alert('Готово!'); });
}
function loadVideos() {
  fetch('/api/videos').then(r => r.json()).then(data => {
    const list = document.getElementById('video-list'); list.innerHTML = '';
    if(!data.length) return list.innerHTML = '<div class="card">Нет видео.</div>';
    const seasons = {};
    data.forEach(v => { if(!seasons[v.season]) seasons[v.season]=[]; seasons[v.season].push(v); });
    for(const s in seasons) {
      const sDiv = document.createElement('div');
      sDiv.innerHTML = `<div class="season-title">Сезон ${s}</div>`;
      seasons[s].forEach(v => {
        const item = document.createElement('div'); item.className = 'video-item';
        item.innerHTML = `<span>Серия ${v.episode}: ${v.title}</span>`;
        const b = document.createElement('div');
        b.innerHTML = `<button class="btn" onclick='playV(${JSON.stringify(v)})'>▶ Смотреть</button>`;
        if(currentUser.role === 'admin') b.innerHTML += ` <button class="btn btn-del" onclick="delV(${v.id})">Удалить</button>`;
        item.appendChild(b); sDiv.appendChild(item);
      });
      list.appendChild(sDiv);
    }
  });
}
function delV(id) { if(!confirm('Удалить?')) return; fetch('/api/videos/'+id, { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: adminPass }) }).then(() => loadVideos()); }
function playV(v) {
  document.getElementById('player-box').style.display = 'block';
  document.getElementById('player-title').innerText = `Сезон ${v.season}, Серия ${v.episode}: ${v.title}`;
  const c = document.getElementById('player-container'); c.innerHTML = '';
  const video = document.createElement('video'); video.src = v.url; video.controls = true; c.appendChild(video);
  document.getElementById('download-link').href = v.url;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- ЧАТ ---
function loadUsersList() {
  fetch('/api/users').then(r => r.json()).then(users => {
    const container = document.getElementById('users-list-container');
    container.innerHTML = '';
    users.forEach(u => {
      if (u.email === currentUser.email) return; // не показываем себя
      const el = document.createElement('div');
      el.className = 'user-item';
      el.innerHTML = `<div class="avatar">${u.name[0].toUpperCase()}</div> ${u.name}`;
      el.onclick = () => {
        document.querySelectorAll('.chat-sidebar .user-item').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        // Для личного чата ID - это комбинация email'ов, чтобы у обоих был один чат
        const chatId = [currentUser.email, u.email].sort().join('_');
        currentChatId = chatId;
        currentChatName = 'Чат с ' + u.name;
        document.getElementById('chat-header').innerText = currentChatName;
        loadChat();
      };
      container.appendChild(el);
    });
  });
}

function selectChat(id, name, el) {
  document.querySelectorAll('.chat-sidebar .user-item').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  currentChatId = id;
  currentChatName = name;
  document.getElementById('chat-header').innerText = name;
  loadChat();
}

function loadChat() {
  if (!currentUser) return;
  fetch('/api/messages/' + currentChatId).then(r => r.json()).then(data => {
    const box = document.getElementById('chat-messages');
    box.innerHTML = '';
    data.forEach(m => {
      const isMe = m.from_email === currentUser.email;
      const div = document.createElement('div'); 
      div.className = 'msg' + (isMe ? ' my' : '');
      div.innerHTML = `
        <div class="avatar" style="background:${isMe ? '#FF3D00' : '#26262E'}">${m.from_name[0].toUpperCase()}</div>
        <div>
           <div class="msg-name">${m.from_name}</div>
           <div class="msg-bubble">${m.text}</div>
        </div>
      `;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
}

function sendMsg() {
  const text = document.getElementById('chat-input').value;
  if(!text.trim() || !currentUser) return;
  fetch('/api/messages', { 
    method: 'POST', 
    headers: {'Content-Type': 'application/json'}, 
    body: JSON.stringify({ 
      chat_id: currentChatId, 
      from_email: currentUser.email,
      from_name: currentUser.name, 
      text 
    }) 
  }).then(() => { document.getElementById('chat-input').value = ''; loadChat(); });
}

checkSavedLogin();
</script>
</body>
</html>
